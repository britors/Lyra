[package]
name = "lyra-installer-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Rust domain model for the Lyra OS installer"
repository = "https://github.com/britors/Lyra"

[workspace]
members = ["src-tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "debuginfo"
