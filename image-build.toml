schema = 1

[image]
name = "lyra-os"
description = "config.xml"
architecture = "x86_64"

[source]
repository = "https://github.com/britors/Lyra"

[distribution]
iso_provider = "sourceforge"

[obs]
api_url = "https://api.opensuse.org"
role = "packages-only"

[[obs.package_sources]]
project = "home:rodrigosbrito:lyra"
repository = "openSUSE_Leap_16.0"

[[obs.package_sources]]
project = "home:rodrigosbrito:vega"
repository = "openSUSE_Leap_16.0"

[[obs.package_sources]]
project = "home:rodrigosbrito:fina"
repository = "openSUSE_Leap_16.0"

[[obs.package_sources]]
project = "Virtualization:Appliances:Builder"
repository = "openSUSE_Leap_16.0"

[artifacts]
required = [
  "iso",
  "packages",
  "verified",
  "report",
  "checksum",
  "checksum_signature",
  "cyclonedx_sbom",
  "spdx_sbom",
]
