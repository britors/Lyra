#
# /etc/pacman.conf para o build do Lyra OS
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Repositório do projeto Lyra OS — prioridade acima do `extra` (§10.1)
# Serve: lyrae, lyraed, lyra-desktop, lyra-backgrounds, lyra-themes
# TODO: substituir pela URL real do repositório assim que hospedado.
[lyra]
SigLevel = Required DatabaseOptional
Server = file:///srv/lyra-repo/$arch
