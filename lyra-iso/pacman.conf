#
# /etc/pacman.conf para o build do Lyra OS
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# A seção [lyra] (repositório local de pacotes AUR/monorepo — calamares,
# lyra-branding, calamares-lyra-winmigrate, prosa, fina) é adicionada aqui
# automaticamente por scripts/setup-build-host.sh, apontando para
# ~/.local/share/lyra-repo do usuário que rodou o setup. Rode esse script
# antes de build.sh se esta seção ainda não existir abaixo.
# TODO: substituir pela URL real do repositório hospedado quando existir
# (ver PROMPT-LYRA-OS.md §10.1) — nesse momento a seção deixa de ser
# gerenciada pelo setup-build-host.sh e passa a ser fixa aqui.

# ATENÇÃO: repositório local de desenvolvimento (TrustAll).
# Ao publicar o repositório 'lyra' oficial com assinatura GPG própria,
# substituir este bloco pela configuração de produção do PROMPT-LYRA-OS.md §10.1.
[lyra]
SigLevel = Optional TrustAll
Server = file:///home/rodrigo/.local/share/lyra-repo
