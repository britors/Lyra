<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lyro — mascote oficial do Lyra OS (PROMPT-LYRA-IDENTIDADE.md §3.1)
  Ilustração vetorial de referência (pose frontal, neutra). Variações de
  pose futuras (acenando, apontando, erro) partem desta mesma arte-base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="lyraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5BE3"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8ECFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hoodInterior">
      <path d="M42,42 Q56,18 70,36 Q85,54 100,30 Q115,8 130,36 Q144,54 158,42
               L162,140 Q163,150 150,150 L50,150 Q37,150 38,140 Z"/>
    </clipPath>
  </defs>

  <!-- Cajado com ponta em lira e estrela -->
  <g>
    <line x1="176" y1="120" x2="176" y2="230" stroke="#2D5BE3" stroke-width="4" stroke-linecap="round"/>
    <path d="M168,120 C166,108 170,98 176,96 C182,98 186,108 184,120"
          fill="none" stroke="url(#lyraGradient)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="176" cy="90" r="14" fill="url(#starGlow)"/>
    <path d="M176,80 L178.4,87.6 L186,90 L178.4,92.4 L176,100 L173.6,92.4 L166,90 L173.6,87.6 Z"
          fill="#E8ECFF"/>
  </g>

  <!-- Manto/capuz — fundo escuro, ponta ondulada, borda em degradê -->
  <path d="M40,40 Q55,14 70,34 Q85,54 100,28 Q115,4 130,34 Q145,56 160,40
           L166,150 Q170,235 150,252 Q138,260 62,260 Q30,252 34,150 Z"
        fill="#0D0D1F"/>
  <path d="M40,40 Q55,14 70,34 Q85,54 100,28 Q115,4 130,34 Q145,56 160,40"
        fill="none" stroke="url(#lyraGradient)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Interior do manto — textura de céu estrelado -->
  <g clip-path="url(#hoodInterior)">
    <rect x="30" y="0" width="140" height="160" fill="#12122a"/>
    <circle cx="55" cy="40" r="1.4" fill="#E8ECFF" opacity="0.8"/>
    <circle cx="72" cy="60" r="1" fill="#E8ECFF" opacity="0.6"/>
    <circle cx="95" cy="35" r="1.6" fill="#E8ECFF" opacity="0.9"/>
    <circle cx="120" cy="55" r="1" fill="#E8ECFF" opacity="0.6"/>
    <circle cx="140" cy="38" r="1.3" fill="#E8ECFF" opacity="0.8"/>
    <circle cx="65" cy="90" r="1" fill="#E8ECFF" opacity="0.5"/>
    <circle cx="130" cy="95" r="1.2" fill="#E8ECFF" opacity="0.7"/>
    <circle cx="105" cy="75" r="1" fill="#E8ECFF" opacity="0.5"/>
  </g>

  <!-- Corpo — arredondado, compacto -->
  <path d="M100,90 C55,90 42,125 42,165 C42,215 65,248 100,248 C135,248 158,215 158,165 C158,125 145,90 100,90 Z"
        fill="#1A1A2E"/>

  <!-- Bracos/coto arredondados -->
  <circle cx="46" cy="180" r="14" fill="#1A1A2E"/>
  <circle cx="154" cy="180" r="14" fill="#1A1A2E"/>

  <!-- Fones de ouvido -->
  <circle cx="55" cy="128" r="16" fill="#12122a" stroke="url(#lyraGradient)" stroke-width="2.5"/>
  <circle cx="145" cy="128" r="16" fill="#12122a" stroke="url(#lyraGradient)" stroke-width="2.5"/>
  <line x1="50" y1="122" x2="50" y2="134" stroke="#E8ECFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <line x1="55" y1="120" x2="55" y2="136" stroke="#E8ECFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <line x1="60" y1="122" x2="60" y2="134" stroke="#E8ECFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <line x1="140" y1="122" x2="140" y2="134" stroke="#E8ECFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <line x1="145" y1="120" x2="145" y2="136" stroke="#E8ECFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <line x1="150" y1="122" x2="150" y2="134" stroke="#E8ECFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>

  <!-- Visor / rosto -->
  <ellipse cx="100" cy="140" rx="38" ry="26" fill="#08081a"/>

  <!-- Olhos -->
  <ellipse cx="85" cy="138" rx="9" ry="11" fill="#3B82F6"/>
  <ellipse cx="115" cy="138" rx="9" ry="11" fill="#3B82F6"/>
  <circle cx="82" cy="133" r="3" fill="#E8ECFF"/>
  <circle cx="112" cy="133" r="3" fill="#E8ECFF"/>

  <!-- Sorriso -->
  <path d="M88,153 Q100,161 112,153" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Emblema no peito (logo da lira, simplificado) -->
  <g transform="translate(85,190) scale(0.32)">
    <path d="M27,88 C23,64 20,42 22,24 C23,15 27,9 34,7"
          fill="none" stroke="url(#lyraGradient)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M60,88 C63,68 64,50 61,36 C59,29 55,25 49,23"
          fill="none" stroke="url(#lyraGradient)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M33,9 C39,13 45,17 49,23"
          fill="none" stroke="url(#lyraGradient)" stroke-width="6" stroke-linecap="round"/>
    <rect x="18" y="84" width="70" height="12" rx="6" fill="url(#lyraGradient)"/>
  </g>
</svg>
