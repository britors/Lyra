<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lyra OS — logo master (lira estilizada em forma de "L")
  Fonte de verdade vetorial. Não editar cores manualmente — usar os
  tokens de branding/palette.json. Variantes derivadas: lyra-logo-mono.svg
  (branco, fundos escuros) e lyra-logo-dark.svg (escuro, fundos claros).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lyraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5BE3"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Haste alta (traço vertical do "L" / braço esquerdo da lira) -->
  <path d="M27,88 C23,64 20,42 22,24 C23,15 27,9 34,7"
        fill="none" stroke="url(#lyraGradient)" stroke-width="8.5"
        stroke-linecap="round"/>

  <!-- Braço curto (segundo braço da lira, aninhado à direita) -->
  <path d="M60,88 C63,68 64,50 61,36 C59,29 55,25 49,23"
        fill="none" stroke="url(#lyraGradient)" stroke-width="8.5"
        stroke-linecap="round"/>

  <!-- Jugo (crossbar) ligando as duas hastes no topo -->
  <path d="M33,9 C39,13 45,17 49,23"
        fill="none" stroke="url(#lyraGradient)" stroke-width="6"
        stroke-linecap="round"/>

  <!-- 4 cordas verticais, do jugo até a caixa de ressonância -->
  <line x1="32" y1="20" x2="32" y2="84" stroke="#E8ECFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="40" y1="17" x2="40" y2="84" stroke="#E8ECFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="48" y1="20" x2="48" y2="84" stroke="#E8ECFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="56" y1="27" x2="56" y2="84" stroke="#E8ECFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>

  <!-- Caixa de ressonância / base (traço horizontal do "L", estende além dos braços) -->
  <rect x="18" y="84" width="70" height="12" rx="6" fill="url(#lyraGradient)"/>

  <!-- Estrela de quatro pontas no topo -->
  <path d="M31,0 L33.4,6.6 L40,9 L33.4,11.4 L31,18 L28.6,11.4 L22,9 L28.6,6.6 Z"
        fill="url(#lyraGradient)"/>
</svg>
