# Lyra OS — settings.conf do Calamares (PROMPT-CALAMARES-MIGRACAO-WINDOWS.md §2)
#
# Baseado na sequência padrão de um instalador Calamares para Arch
# (grub + mkinitcpio + NetworkManager + gdm, conforme
# lyra-iso/packages.x86_64), com dois blocos adicionais para o módulo
# de migração do Windows:
#
#   1. "partition" roda em um bloco exec isolado, logo após a etapa de
#      particionamento (show), para que o layout de disco definitivo já
#      esteja aplicado antes da varredura de "winmigrate-detect" — a
#      partição Windows precisa existir fisicamente para ser montada.
#   2. A tela "winmigrate" só aparece entre Partition e Users se a
#      detecção encontrou algo; caso contrário ela se auto-pula (ver
#      winmigrate/main.qml).
#   3. "winmigrate-copy" roda no bloco exec final, depois de "users"
#      (a conta de destino já precisa existir) e antes de
#      "displaymanager"/"networkcfg", para não atrasar o restante da
#      instalação em caso de perfil grande.
#
# Este arquivo substitui o settings.conf padrão do pacote `calamares` —
# revisar caso módulos adicionais sejam introduzidos por outra spec
# (ex.: PROMPT-LYRA-OS.md) depois desta.

modules-search: [ local, /usr/lib/calamares/modules ]

# Calamares não tem uma interface "qml" para módulos "view" — toda tela
# exige um plugin C++ compilado. "winmigrate" reaproveita o módulo
# genérico notesqml (que já é qtplugin, pronto no pacote calamares) para
# hospedar winmigrate/main.qml sem precisarmos escrever C++. Config da
# instância em winmigrate.conf; QML instalado em
# /usr/share/calamares/branding/lyra/winmigrate.qml pelo PKGBUILD deste
# pacote.
instances:
- module: "notesqml"
  id: "winmigrate"
  config: "winmigrate.conf"

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition

- exec:
  - partition
  - winmigrate-detect

- show:
  - notesqml@winmigrate
  - users
  - summary

- exec:
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - initcpiocfg
  - initcpio
  - users
  - winmigrate-copy
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - umount

- show:
  - finished

branding: lyra
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
