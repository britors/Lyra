# Lyra OS — mapeamento de conteúdo migrado do Windows (PROMPT-CALAMARES-MIGRACAO-WINDOWS.md §4)
#
# Fonte única de verdade consultada tanto pelo job de detecção
# (winmigrate-detect) quanto pelo job de cópia (winmigrate-copy).
# Instalado em /etc/calamares/modules/winmigrate-mapping.conf.
#
# Campos por item:
#   source:   caminho relativo dentro do perfil Windows (Users/<perfil>/...)
#   dest:     caminho relativo dentro do $HOME do novo usuário Lyra
#   default:  se o checkbox vem pré-selecionado na tela de escolha
#   kind:     "directory" (cópia recursiva via rsync) ou "browser-bookmarks"
#             (tratamento especial de conversão, ver copy_job.py)

items:
  - id: documents
    source: "Documents"
    dest: "Documentos/Do Windows"
    default: true
    kind: directory

  - id: pictures
    source: "Pictures"
    dest: "Imagens/Do Windows"
    default: true
    kind: directory

  - id: videos
    source: "Videos"
    dest: "Vídeos/Do Windows"
    default: true
    kind: directory

  - id: music
    source: "Music"
    dest: "Música/Do Windows"
    default: true
    kind: directory

  - id: desktop
    source: "Desktop"
    dest: "Área de Trabalho/Do Windows"
    default: true
    kind: directory

  - id: downloads
    source: "Downloads"
    dest: "Downloads/Do Windows"
    default: false
    kind: directory

  - id: browser_bookmarks
    source: "AppData/Local"
    dest: ".mozilla/firefox/__PROFILE__/bookmarks-importados.html"
    default: true
    kind: browser-bookmarks
    # Candidatos de origem verificados dentro de AppData/Local, em ordem:
    #   Google/Chrome/User Data/Default/Bookmarks
    #   Microsoft/Edge/User Data/Default/Bookmarks
    browser_candidates:
      - "Google/Chrome/User Data/Default/Bookmarks"
      - "Microsoft/Edge/User Data/Default/Bookmarks"

# Perfis de sistema — nunca listados como perfil de usuário migrável (§4).
excluded_profiles:
  - "Default"
  - "Default User"
  - "Public"
  - "All Users"
