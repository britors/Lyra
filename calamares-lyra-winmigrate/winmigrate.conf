# Lyra OS — configuração da instância "winmigrate" do módulo notesqml
# (PROMPT-CALAMARES-MIGRACAO-WINDOWS.md §6.1, §7)
#
# O Calamares não tem uma interface "qml" para módulos do tipo "view" —
# toda view precisa de um plugin C++ compilado (ver módulos qtplugin
# como welcomeq/usersq/finishedq). "notesqml" é o módulo genérico que o
# próprio Calamares já traz pronto para hospedar um arquivo QML externo
# como uma tela do instalador, sem exigir C++ do nosso lado.
#
# Este arquivo configura a instância "notesqml@winmigrate" (declarada em
# settings.conf, seção instances) para carregar o QML de
# lyra-branding/calamares-branding — ver PKGBUILD deste pacote, que
# instala winmigrate/main.qml como
# /usr/share/calamares/branding/lyra/winmigrate.qml.

# Procura o QML só na pasta de branding (não no QRC compilado do módulo).
qmlSearch: branding

# Sem qmlFilename: usa o nome da instância ("winmigrate"), i.e. procura
# .../branding/lyra/winmigrate.qml.

qmlLabel:
    winmigrate: "Migração do Windows"
    winmigrate[pt_BR]: "Migração do Windows"
