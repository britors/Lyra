name: Beta 2 foundations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated release metadata
        run: ./scripts/release.py check
      - name: Verify OBS staging and repository policy
        run: ./scripts/obs-release.py validate
      - name: Verify reproducible KIWI image policy
        run: |
          ./scripts/image-build.py validate
          export_dir="$(mktemp -d)"
          ./scripts/image-build.py export "$export_dir/image"
          ./scripts/image-build.py verify-export "$export_dir/image"
      - name: Test release conventions and traceability
        run: python3 -m unittest discover -s tests -v
      - name: Verify image performance budget
        run: |
          cmp performance.toml kiwi/root/usr/share/lyra-os/performance.toml
          ./kiwi/root/usr/bin/lyra-performance --budget performance.toml check
      - name: Validate shell syntax
        run: bash -n kiwi/config.sh kiwi/test/build-and-run-vm.sh kiwi/root/usr/bin/lyra-report
