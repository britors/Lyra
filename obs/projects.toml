staging = "home:rodrigosbrito:vega:staging"
iso_consumer = true
packages = ["vega-cli", "vega-gtk", "vega-web", "vegad"]

[[projects.targets]]
name = "openSUSE_Leap_16.0"
upstream_project = "openSUSE:Leap:16.0"
upstream_repository = "standard"
architectures = ["x86_64"]
iso_consumer = true

[[projects]]
id = "fina"
