# Lyra OS - Odisseia (v1)
#
# Btrfs subvolume layout, mirroring openSUSE's own default proposal
# (the fallback list in yast2-storage-ng's SubvolSpecification: COW_SUBVOL_PATHS
# / NO_COW_SUBVOL_PATHS, https://github.com/yast/yast-storage-ng) as closely as
# Calamares' mount module allows, per PROMPT-LYRA-OS.md's "Btrfs + Snapper
# (padrao do Leap, mantido)" - i.e. don't deviate from what Leap normally does.
#
# Snapper must create /.snapshots itself, so it cannot be pre-created in this
# list. shellprocess@snapshotcfg creates it after installation and adds the
# separate fstab mount required for snapshot boot/rollback. Calamares' mount
# module has no per-subvolume "nodatacow" attribute, so the four NoCOW paths
# below are created as regular (COW) subvolumes for now; real Leap installs
# mount them nodatacow for database/VM-image workloads.
---
# This file replaces Calamares' packaged mount.conf; module configuration
# files are not merged with the packaged defaults. Keep the standard chroot
# mounts here, in particular efivarfs: grub/shim need it to create the UEFI
# NVRAM entry from inside the target system.
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@/home
    - mountPoint: /opt
      subvolume: /@/opt
    - mountPoint: /srv
      subvolume: /@/srv
    - mountPoint: /tmp
      subvolume: /@/tmp
    - mountPoint: /usr/local
      subvolume: /@/usr/local
    - mountPoint: /var/cache
      subvolume: /@/var/cache
    - mountPoint: /var/crash
      subvolume: /@/var/crash
    - mountPoint: /var/lib/machines
      subvolume: /@/var/lib/machines
    - mountPoint: /var/lib/mailman
      subvolume: /@/var/lib/mailman
    - mountPoint: /var/lib/named
      subvolume: /@/var/lib/named
    - mountPoint: /var/log
      subvolume: /@/var/log
    - mountPoint: /var/opt
      subvolume: /@/var/opt
    - mountPoint: /var/spool
      subvolume: /@/var/spool
    - mountPoint: /var/tmp
      subvolume: /@/var/tmp
    - mountPoint: /boot/grub2/i386-pc
      subvolume: /@/boot/grub2/i386-pc
    - mountPoint: /boot/grub2/x86_64-efi
      subvolume: /@/boot/grub2/x86_64-efi
    # NoCOW on real Leap installs (see gap note above) - still snapshot-excluded
    # by virtue of being separate subvolumes.
    - mountPoint: /var/lib/libvirt/images
      subvolume: /@/var/lib/libvirt/images
    - mountPoint: /var/lib/mariadb
      subvolume: /@/var/lib/mariadb
    - mountPoint: /var/lib/mysql
      subvolume: /@/var/lib/mysql
    - mountPoint: /var/lib/pgsql
      subvolume: /@/var/lib/pgsql

btrfsSwapSubvol: /@/swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, compress=zstd ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
