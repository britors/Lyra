# Lyra OS - Odisseia (v1)
---
overwrite: false
prefer_grub_d: false
keep_distributor: false

#
# Deliberately just "quiet", not "quiet splash": checked the actual
# grubcfg main.py - it separately auto-detects `plymouth` in the target
# (installed here, see config.xml) and appends "splash" to kernel_params
# on its own. Listing "splash" here too would duplicate it verbatim
# ("quiet splash splash") in the written GRUB_CMDLINE_LINUX_DEFAULT - the
# auto-detect alone already produces the intended "quiet splash".
kernel_params: [ "quiet" ]

defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    # Keep the graphical terminal: console disables GRUB_THEME and made the
    # installed system lose the Lyra menu background after Calamares reran
    # grub2-mkconfig.
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_DISABLE_RECOVERY: true
    # Turns on the "Start bootloader from a read-only snapshot" submenu,
    # generated by /etc/grub.d/80_suse_btrfs_snapshot (from the openSUSE
    # `grub2` package - it checks this exact variable). Needed for the
    # spec's GRUB panic-button rollback; see modules/snapshotcfg.conf for
    # how the (read-only) snapshots it lists get created.
    SUSE_BTRFS_SNAPSHOT_BOOTING: true

#
# Must be true, not the module's own default (false): checked the actual
# grubcfg main.py - `defaults:` below is only ever applied "if
# always_use_defaults or overwrite or not os.path.exists(default_grub)".
# Leap always ships /etc/default/grub already, and overwrite is
# (correctly) false here, so without this, every key in `defaults:`
# below - including SUSE_BTRFS_SNAPSHOT_BOOTING - would silently never
# get written. The actual file edit this triggers
# (update_existing_config() in that same source) is a safe line-level
# update, not a full rewrite, so it won't clobber GRUB_THEME (set
# separately by the lyra-enterprise-theme package's own %post).
always_use_defaults: true
