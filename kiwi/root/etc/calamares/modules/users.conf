# Lyra OS - Odisseia (v1)
# Overrides on top of Calamares' users module defaults.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio

# wheel already carries sudo rights via /etc/sudoers.d/10-installer,
# written by Calamares because sudoersGroup is set below.
sudoersGroup: wheel
sudoersConfigureWithGroup: false

# root desabilitado (PROMPT-LYRA-OS.md): no root password is ever set,
# hides the root/"reuse password" fields. The user created here is the
# only admin account, via the wheel/sudoers group above.
setRootPassword: false
doReusePassword: false

displayAutologin: true
doAutologin: false

passwordRequirements:
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"

# Hostname padrao sugerido: lyra-os (PROMPT-LYRA-OS.md). Literal text (no
# ${} placeholders) is used as-is, so this is just a suggestion - the
# hostname field stays free-text editable in the UI.
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "lyra-os"
  forbidden_names: [ localhost ]
