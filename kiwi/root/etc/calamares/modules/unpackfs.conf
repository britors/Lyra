# Lyra OS - Odisseia (v1)
#
# Source must be the actual squashfs image file, not the already-mounted
# rootfs directory. Calamares' unpackfs module (main.py's do_count) runs
# `unsquashfs -l <source>` directly against this path - pointing it at a
# plain directory (e.g. /run/overlay/rootfsbase, the dracut-kiwi-live
# mountpoint) makes unsquashfs fail immediately with a bare non-zero
# exit status, no useful message ("Arquivo de script principal ruim" in
# the Calamares UI). Confirmed via the live session's own `mount` output
# (2026-07-29): /dev/sr0 (the boot media) is mounted at
# /run/overlay/live, and the squashfs is loop-mounted from
# /LiveOS/squashfs.img relative to that root - so the real image file is
# /run/overlay/live/LiveOS/squashfs.img. Confirmed the loop device's
# backing_file via /sys/block/loop0/loop/backing_file, not guessed.
---
unpack:
    - source: "/run/overlay/live/LiveOS/squashfs.img"
      sourcefs: "squashfs"
      destination: ""
