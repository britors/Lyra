# Lyra OS - Odisseia (v1)
#
# Source is the already-mounted live rootfs from the dracut-kiwi-live
# module (kiwi/config.xml's <type image="iso" flags="overlay">), at
# /run/overlay/rootfsbase. Since that path is a directory rather than an
# image file, Calamares' unpackfs module bind-mounts it rather than
# actually mounting a squashfs image - "sourcefs: squashfs" here only
# needs to satisfy the supported-filesystem check (squashfs is already
# loaded, since that's how the live media itself booted).
#
# If the build host's kiwi-ng is older than ~9.21.18, this path used to
# be /run/rootfsbase (no "overlay/" segment) - adjust if unsquashing
# fails with "source ... does not exist".
---
unpack:
    - source: "/run/overlay/rootfsbase"
      sourcefs: "squashfs"
      destination: ""
