# Lyra OS - Odisseia (v1)
#
# unpackfs copies the complete live squashfs to the target. Remove every
# live-only account and launcher before the first installed-system snapshot;
# otherwise GDM would keep automatically logging in as liveuser and that user
# would retain passwordless permission to run the disk installer as root.
---
dontChroot: false
timeout: 60
verbose: true

script:
    - command: "/usr/sbin/userdel --force --remove liveuser"
      timeout: 30
    # Priorities 1-3 are needed only while KIWI selects Lyra's Qt6-enabled
    # Calamares fork. On the installed system, keep official Leap packages
    # preferred over any same-name package from a personal OBS project.
    - command: >-
        /usr/bin/zypper --non-interactive modifyrepo --priority 90 repo-lyra
      timeout: 30
    - command: >-
        /usr/bin/zypper --non-interactive modifyrepo --priority 90 repo-vega
      timeout: 30
    - command: >-
        /usr/bin/zypper --non-interactive modifyrepo --priority 90 repo-fina
      timeout: 30
    - command: >-
        /usr/bin/rm -f
        /etc/gdm/custom.conf
        /etc/xdg/autostart/lyra-installer-autostart.desktop
        /etc/polkit-1/rules.d/00-lyra-live-installer.rules
        /usr/share/applications/calamares.desktop
      timeout: 30

i18n:
    name: "Removing live-session files"
    name[pt_BR]: "Removendo arquivos da sessão live"
