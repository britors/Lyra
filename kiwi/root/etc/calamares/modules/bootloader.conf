# Lyra OS - Odisseia (v1)
#
# The generic Calamares bootloader job is deliberately not in settings.conf.
# Lyra uses shellprocess@uefibootloader and Leap's native shim-install so the
# signed shim, fallback loader and UEFI NVRAM entry are installed together.
# Keep this set to none so re-adding the generic job cannot accidentally
# install an unsigned GRUB-only entry alongside shim.
---
efiBootLoader: "none"

kernelParams: [ "quiet", "splash" ]

grubInstall: "grub2-install"
grubMkconfig: "grub2-mkconfig"
grubCfg: "/boot/grub2/grub.cfg"
grubProbe: "grub2-probe"
efiBootMgr: "efibootmgr"

installEFIFallback: true
installHybridGRUB: false
