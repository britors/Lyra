# Lyra OS - Odisseia (v1)
#
# Bootstraps Snapper on the "@" root Calamares' own mount module already
# creates and mounts (see modules/mount.conf). Runs chrooted, and - this
# matters - AFTER grubcfg+uefibootloader in settings.conf's sequence, not
# before. See the ordering note at the bottom before moving this.
#
# `snapper -c root create-config /` is the same command SUSE's own
# Snapper Tutorial documents for adding Snapper to an *already mounted*
# Btrfs root (see https://en.opensuse.org/openSUSE:Snapper_Tutorial and
# the create-config docs at http://snapper.io/manpages/snapper.html).
# --no-dbus because there's no dbus daemon running inside the chroot -
# the same flag openSUSE/snapper's own installation-helper test scripts
# use (client/installation-helper/test1.sh, test2.sh in
# https://github.com/openSUSE/snapper).
#
# --read-only on the "create" call is mandatory, not cosmetic: grub2's
# own snapshot-menu generator (80_suse_btrfs_snapshot +
# grub2-snapper-plugin.sh, both in the openSUSE `grub2` package's
# sources) explicitly skips any snapshot whose content is still
# writable - see the "list only read-only snapshot (bnc#878528)" check
# in grub2-snapper-plugin.sh. A writable snapshot here would silently
# never show up in "Start bootloader from a read-only snapshot".
#
# DELIBERATE SIMPLIFICATION vs. YaST/Agama: YaST makes the very first
# snapshot *be* the default root subvolume itself, via snapper's
# `/usr/lib/snapper/installation-helper --step filesystem`
# (see client/installation-helper/readme.txt in the snapper repo above),
# so "day 0" already exists as snapshot #1 before anything is unpacked.
# Reproducing that exactly would mean replacing Calamares' partition/mount
# handling for "/" with a custom module - out of proportion for what the
# spec actually needs (GRUB rollback working from here on). This instead
# runs create-config against the ordinary "@" subvolume Calamares' mount
# module already mounts explicitly and then makes /@ the Btrfs default
# subvolume before creating the Snapper config. It also removes subvol=/@
# from the root fstab entry so a later `snapper rollback` can switch the
# default subvolume permanently. After create-config has created the
# .snapshots subvolume, the helper adds its separate fstab mount; otherwise
# booting a root snapshot would hide the global snapshot tree inside /@.
# Dracut is then regenerated with --fstab so its host-only command line is
# derived from that final root entry and cannot retain subvol=/@ from the
# still-mounted installation target.
# Practical difference: there is no pristine
# "as-installed" snapshot to roll back to - only the "first root
# filesystem" snapshot created below, and every snapshot from here on,
# are available for rollback via GRUB.
#
# ORDERING: a snapshot freezes a copy of /boot/grub2/grub.cfg as it
# exists at snapshot time (grub2-snapper-plugin uses that frozen copy to
# boot into the snapshot). So the *first* grub.cfg (written by
# shellprocess@uefibootloader) has to exist before "create" runs here, or the
# snapshot's own /boot/grub2/grub.cfg is missing and
# grub2-snapper-plugin.sh silently excludes it. And because that first
# grub2-mkconfig run happened before any snapshot existed, its generated
# submenu doesn't list this snapshot either - hence the explicit
# grub2-mkconfig re-run below, after the snapshot exists. (This should
# also happen automatically through grub2-snapper-plugin's own
# create-snapshot-post hook once the `grub2-snapper-plugin` package is
# installed - the manual re-run is a deliberate belt-and-suspenders,
# since relying solely on an unverified plugin auto-registration path
# felt riskier than one extra grub2-mkconfig call.)
---
dontChroot: false
timeout: 60

script:
    - command: "/bin/bash /usr/libexec/lyra-configure-btrfs-rollback prepare-root"
      timeout: 30
    - command: "/usr/bin/snapper --no-dbus -c root create-config /"
      timeout: 60
    - command: "/bin/bash /usr/libexec/lyra-configure-btrfs-rollback mount-snapshots"
      timeout: 30
    - command: "/usr/bin/dracut --force --fstab"
      timeout: 120
    - command: >-
        /usr/bin/snapper --no-dbus -c root create --read-only --type single
        --cleanup-algorithm number
        --description "first root filesystem"
        --userdata "important=yes"
      timeout: 30
    - command: "/usr/sbin/grub2-mkconfig -o /boot/grub2/grub.cfg"
      timeout: 60
    # Keep the helper available until every fallible setup step has completed,
    # so retrying this job remains possible after a late dracut/GRUB error.
    - command: >-
        /usr/bin/rm -rf --
        /etc/calamares
        /usr/libexec/lyra-configure-btrfs-rollback
      timeout: 30

i18n:
    name: "Setting up snapshots"
