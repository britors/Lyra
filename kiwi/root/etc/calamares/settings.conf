# Lyra OS - Odisseia (v1)
# Calamares top-level settings. See /kiwi/README.md for scope/gaps.
#
# Sequence adapted from Calamares' upstream default settings.conf, with
# the Arch-specific initcpiocfg/initcpio steps replaced by dracut (Leap
# uses dracut, not mkinitcpio), and grubcfg enabled (openSUSE binary
# names are set in modules/grubcfg.conf and modules/bootloader.conf).
---
modules-search: [ local ]

# shellprocess@snapshotcfg bootstraps Snapper on the freshly-populated
# root - see modules/snapshotcfg.conf for what it does and why.
instances:
- id:       snapshotcfg
  module:   shellprocess
  config:   snapshotcfg.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - dracut
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  # After bootloader, not before: the snapshot taken here freezes a
  # copy of /boot/grub2/grub.cfg, which has to exist first. See the
  # ordering note in modules/snapshotcfg.conf.
  - shellprocess@snapshotcfg
  - umount
- show:
  - finished

# Not yet customized for Lyra OS - see /kiwi/README.md. Using upstream
# Calamares' bundled placeholder branding until the Lyra-Theme branding
# step ships real product strings/images.
branding: default

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
