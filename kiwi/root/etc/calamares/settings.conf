# Lyra OS - Odisseia (v1)
# Calamares top-level settings. See /kiwi/README.md for scope/gaps.
#
# Sequence adapted from Calamares' upstream default settings.conf, with
# the Arch-specific initcpiocfg/initcpio steps replaced by dracut (Leap
# uses dracut, not mkinitcpio), grubcfg enabled, and the generic bootloader
# job replaced by Leap's native shim-install flow below.
---
modules-search: [ local ]

# shellprocess@uefibootloader uses Leap's native shim-install instead of
# Calamares' generic grub2-install path. shellprocess@snapshotcfg then
# bootstraps Snapper on the freshly-populated root.
instances:
- id:       uefibootloader
  module:   shellprocess
  config:   uefibootloader.conf
- id:       snapshotcfg
  module:   shellprocess
  config:   snapshotcfg.conf
- id:       installcleanup
  module:   shellprocess
  config:   installcleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - dracut
  - users
  - displaymanager
  # The target was populated from the live squashfs. Remove its autologin
  # account and live-only installer privileges before taking any snapshot.
  - shellprocess@installcleanup
  # Calamares is needed by the live image, not by the installed system.
  - packages
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - shellprocess@uefibootloader
  # After the UEFI bootloader, not before: the snapshot taken here freezes a
  # copy of /boot/grub2/grub.cfg, which has to exist first. See the
  # ordering note in modules/snapshotcfg.conf.
  - shellprocess@snapshotcfg
  - umount
- show:
  - finished

# Lyra product strings (root/etc/calamares/branding/lyra/branding.desc).
# Images/slideshow still reuse calamares-branding-upstream's "default"
# assets - swapping those for real Lyra logo/wallpaper is separate
# follow-up work, see kiwi/README.md.
branding: lyra

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
