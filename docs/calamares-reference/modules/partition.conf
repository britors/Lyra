# Lyra OS - Odisseia (v1)
# Overrides on top of Calamares' partition module defaults.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB

# Swap: zram only, no swap partition or swapfile. A single choice means
# Calamares doesn't even show a swap-size UI - it silently creates none.
userSwapChoices:
    - none

defaultFileSystemType: "btrfs"
# Snapper and the GRUB rollback flow below are mandatory parts of Lyra OS.
# Offering another root filesystem would let the copy finish and then make
# shellprocess@snapshotcfg fail near the end of the installation.
availableFileSystemTypes: ["btrfs"]

initialPartitioningChoice: none
initialSwapChoice: none
