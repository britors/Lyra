# Lyra OS - Odisseia (v1)
# Overrides on top of Calamares' dracut module defaults.
#
# Without this override, Calamares falls back to
# calamares-branding-upstream's example dracut.conf, which sets:
#   initramfsName: /boot/initramfs-freebsd.img
# That's an unfixed upstream placeholder, not anything Lyra chose - it
# makes Calamares write the target's initramfs to the wrong file instead
# of the kernel-versioned name GRUB actually expects
# (/boot/initramfs-$(uname -r).img). Confirmed by reading dracut/main.py
# from the installed calamares package: initramfsName, when set, is
# appended verbatim to the dracut command line. Omitting the key here
# leaves dracut to pick its own correct default name.
---
options: [ "-f" ]
