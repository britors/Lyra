# Lyra OS - Odisseia (v1)
#
# Remove live-installer RPMs from the copied target. try_remove keeps an
# otherwise successful installation from failing if a branding package name
# changes; the security-sensitive live files are removed independently by
# shellprocess@installcleanup.
---
backend: zypp
update_db: false
update_system: false
skip_if_no_internet: false

operations:
    - try_remove:
        - calamares
        - calamares-branding-upstream
