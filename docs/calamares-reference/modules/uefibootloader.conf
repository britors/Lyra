# Lyra OS - Odisseia (v1)
#
# Leap's supported UEFI/Secure Boot setup is performed by shim-install. It
# installs the signed shim and GRUB EFI images, the removable fallback, and
# the NVRAM entry. Calamares' generic "grub" path only invokes grub2-install
# and therefore does not install openSUSE's signed shim correctly.
#
# This ISO is UEFI-only (kiwi/config.xml), so failure of either command is a
# fatal installation error. extraMounts in mount.conf makes efivarfs, /dev,
# /proc, /sys and /run available in this target chroot.
---
dontChroot: false
timeout: 120
verbose: true

script:
    - command: "/usr/sbin/grub2-mkconfig -o /boot/grub2/grub.cfg"
      timeout: 120
    - command: >-
        /usr/sbin/shim-install
        --efi-directory=/boot/efi
        --config-file=/boot/grub2/grub.cfg
      timeout: 120

i18n:
    name: "Installing the UEFI bootloader"
    name[pt_BR]: "Instalando o carregador de inicialização UEFI"
