# Lyra OS - Odisseia (v1)
# Leap ships these enabled by default already; listed explicitly so the
# installed system doesn't depend on scriptlet ordering during unpack.
---
units:
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: true

  - name: "firewalld.service"
    action: "enable"
    mandatory: true

  - name: "gdm.service"
    action: "enable"
    mandatory: true

  - name: "cups.service"
    action: "enable"
    mandatory: true
